name: Dashboard aktualisieren

on:
  workflow_dispatch:
  schedule:
    - cron: "10 5 * * *"
      timezone: "Europe/Zurich"

permissions:
  contents: write

concurrency:
  group: wis-be-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: dashboard.json aus GitHub erzeugen
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: python scripts/update_dashboard.py

      - name: Änderungen speichern
        run: |
          if git diff --quiet -- dashboard.json; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.json
          git commit -m "Dashboard-Daten aktualisieren"
          git push
